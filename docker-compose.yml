services:
  user-service:
    build: ./services/user-service
    image: msdevops/user-service:${TAG:-local}
    environment:
      - PORT=3001
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  product-service:
    build: ./services/product-service
    image: msdevops/product-service:${TAG:-local}
    environment:
      - PORT=3002
    networks: [appnet]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  order-service:
    build: ./services/order-service
    image: msdevops/order-service:${TAG:-local}
    environment:
      - PORT=3003
      - USER_SERVICE_URL=http://user-service:3001
      - PRODUCT_SERVICE_URL=http://product-service:3002
    networks: [appnet]
    restart: unless-stopped
    depends_on:
      user-service:    { condition: service_healthy }
      product-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [appnet]
    restart: unless-stopped
    depends_on:
      user-service:    { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service:   { condition: service_healthy }

networks:
  appnet: {}
